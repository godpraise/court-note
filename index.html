        /* ---- 커리큘럼 항목 드래그 순서 변경 (마우스 + 터치 공용, Pointer Events) ---- */
        var dragState = null;
        function dragSiblings(zone) {
          return Array.prototype.slice.call(zone.children).filter(function (c) {
            return c.matches && c.matches("[data-drag-item]");
          });
        }
        function renumberZone(zone) {
          if (!zone) return;
          dragSiblings(zone).forEach(function (item, i) {
            var badge = item.querySelector(
              ":scope > .card > [data-order-badge]",
            );
            if (badge) badge.textContent = i + 1;
          });
        }
        function zoneParentId(zone) {
          var z = zone.dataset.zone;
          if (!z || z === "root") return null;
          return z.slice(6); // strip 'child-'
        }
        function findDropZone(item, x, y) {
          item.style.pointerEvents = "none";
          var overEl = document.elementFromPoint(x, y);
          item.style.pointerEvents = "";
          if (!overEl) return null;
          var hoverBlock = overEl.closest("[data-drag-item]");
          if (hoverBlock && hoverBlock !== item) {
            if (hoverBlock.dataset.isGroup === "1") {
              var childZone = hoverBlock.querySelector(":scope > [data-zone]");
              if (childZone) return childZone;
            }
            var p = hoverBlock.parentElement;
            if (p && p.matches("[data-zone]")) return p;
          }
          var z = overEl.closest("[data-zone]");
          return z || null;
        }
        document.addEventListener("pointerdown", function (e) {
          var handle = e.target.closest("[data-drag-handle]");
          if (!handle) return;
          var item = handle.closest("[data-drag-item]");
          if (!item) return;
          var zone = item.parentElement;
          if (!zone) return;
          try {
            item.setPointerCapture(e.pointerId);
          } catch (err) {}
          item.classList.add("dragging");
          item.style.position = "relative";
          item.style.zIndex = "5";
          dragState = {
            item: item,
            zone: zone,
            origZone: zone,
            pointerId: e.pointerId,
            startY: e.clientY,
            canReparent: item.dataset.isGroup !== "1",
          };
          e.preventDefault();
        });
        document.addEventListener("pointermove", function (e) {
          if (!dragState || e.pointerId !== dragState.pointerId) return;
          var item = dragState.item;
          item.style.transform =
            "translateY(" + (e.clientY - dragState.startY) + "px)";

          if (dragState.canReparent) {
            var target = findDropZone(item, e.clientX, e.clientY);
            if (target && target !== dragState.zone) {
              var beforeTopZ = item.offsetTop;
              var prevZone = dragState.zone;
              target.appendChild(item);
              dragState.zone = target;
              dragState.startY += item.offsetTop - beforeTopZ;
              item.style.transform =
                "translateY(" + (e.clientY - dragState.startY) + "px)";
              renumberZone(prevZone);
            }
          }

          var zone = dragState.zone;
          var siblings = dragSiblings(zone);
          var idx = siblings.indexOf(item);
          var moved = true;
          while (moved) {
            moved = false;
            siblings = dragSiblings(zone);
            idx = siblings.indexOf(item);
            if (idx > 0) {
              var prev = siblings[idx - 1];
              var prevRect = prev.getBoundingClientRect();
              if (e.clientY < prevRect.top + prevRect.height / 2) {
                var beforeTop = item.offsetTop;
                zone.insertBefore(item, prev);
                dragState.startY += item.offsetTop - beforeTop;
                item.style.transform =
                  "translateY(" + (e.clientY - dragState.startY) + "px)";
                moved = true;
                continue;
              }
            }
            siblings = dragSiblings(zone);
            idx = siblings.indexOf(item);
            if (idx < siblings.length - 1) {
              var next = siblings[idx + 1];
              var nextRect = next.getBoundingClientRect();
              if (e.clientY > nextRect.top + nextRect.height / 2) {
                var beforeTop2 = item.offsetTop;
                zone.insertBefore(item, next.nextSibling);
                dragState.startY += item.offsetTop - beforeTop2;
                item.style.transform =
                  "translateY(" + (e.clientY - dragState.startY) + "px)";
                moved = true;
              }
            }
          }
          renumberZone(zone);
        });
        function endDrag(e) {
          if (!dragState || (e && e.pointerId !== dragState.pointerId)) return;
          var item = dragState.item,
            zone = dragState.zone,
            origZone = dragState.origZone;
          item.classList.remove("dragging");
          item.style.transform = "";
          item.style.position = "";
          item.style.zIndex = "";
          try {
            item.releasePointerCapture(dragState.pointerId);
          } catch (err) {}
          var ids = dragSiblings(zone).map(function (c) {
            return c.dataset.id;
          });
          var reparented = zone !== origZone;
          var newParentId = reparented ? zoneParentId(zone) : null;
          var draggedId = item.dataset.id;
          dragState = null;
          if (reparented) item.dataset.parent = newParentId || "root";
          var writes = ids.map(function (id, i) {
            var patch = { order: i };
            if (reparented && id === draggedId) patch.parentId = newParentId;
            return state.db.doc("skills/" + id).update(patch);
          });
          if (reparented) {
            var oldIds = dragSiblings(origZone).map(function (c) {
              return c.dataset.id;
            });
            writes = writes.concat(
              oldIds.map(function (id, i) {
                return state.db.doc("skills/" + id).update({ order: i });
              }),
            );
          }
          Promise.all(writes).then(function () {
            if (reparented) toast("항목을 옮겼어요");
          });
        }
        document.addEventListener("pointerup", endDrag);
        document.addEventListener("pointercancel", endDrag);

        /* ============================= 이벤트 위임 ============================= */

        document.addEventListener("click", function (e) {

            return;

          if (a === "settle-pass") {
            settlePass(act.dataset.id);
            return;
          }
          if (a === "settle-oneday") {
            settleOneday(act.dataset.lesson, act.dataset.member);
            return;
          }
          if (a === "mark-paid") {
            markOnedayPaid(act.dataset.lesson, act.dataset.member);

          }
          if (a === "homework-done") {
            homeworkDone(act.dataset.id);

          if (a === "set-progress") {

          if (a === "edit-venue") {
            modalEditVenue(act.dataset.id);

        });

        byId("modal-backdrop").addEventListener("click", closeModal);
        byId("btn-settings").addEventListener("click", modalSettings);

        /* ============================= 초기화 ============================= */

        var coachSession = window.CourtNoteCoachSession.createSession({
          onReset: function (scopedDb, coachUid) {

            state.scheduleShowPast = false;
            state.scheduleVenueFilter = "all";
            window.CourtNoteCoachSession.collections.forEach(function (name) {
              state.cache[name] = {};
              state.ready[name] = false;
            });
            closeModal();
            NAV.forEach(function (item) { byId("view-" + item.id).hidden = item.id !== "today"; });
            renderAll();
          },
          onSnapshot: function (name, snapshot) {
            var data = {};
            snapshot.docs.forEach(function (doc) { data[doc.id] = doc.data(); });
            state.cache[name] = data;
            state.ready[name] = true;
            renderAll();
          },
          onError: function (error) {
            if (window.__onCourtNoteAccessError) window.__onCourtNoteAccessError(error);
          },
        });
        window.__startCourtNoteApp = function (db, user) { coachSession.start(db, user); };
        window.__stopCourtNoteApp = function () { coachSession.stop(); };
      })();
    </script>

    <!-- ============================================================
     Firebase 연결 설정
     아래 firebaseConfig 값을 본인의 Firebase 프로젝트 설정으로 교체하세요.
     (Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성 에서 확인)
     ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
      (function () {
        "use strict";

        const firebaseConfig = {
          apiKey: "AIzaSyAFILe7QFHAwfnV_1UvQopPyhT7dH7ng9Q",
          authDomain: "court-note.firebaseapp.com",
          projectId: "court-note",
          storageBucket: "court-note.firebasestorage.app",
          messagingSenderId: "1028021803776",
          appId: "1:1028021803776:web:7c259b0298e7514d9c71e5",
        };

        firebase.initializeApp(firebaseConfig);
        var fbAuth = firebase.auth();
        var fbDb = firebase.firestore();
        var startedUid = null;
        var firstUid = null;
        var authGeneration = 0;
        var errEl = document.getElementById("login-error");
        var sentEl = document.getElementById("login-sent");
        var submitBtn = document.getElementById("login-submit");

        function showApp(user) {
          // A new identity gets a fresh document, clearing pending UI promises too.
          if (firstUid && firstUid !== user.uid) {
            window.location.reload();
            return;
          }
          firstUid = user.uid;
          startedUid = user.uid;
          window.__startCourtNoteApp(fbDb, user);
          if (startedUid !== user.uid) return;
          document.getElementById("login-screen").hidden = true;
          document.getElementById("app-root").hidden = false;
        }
        function showLogin() {
          document.getElementById("login-screen").hidden = false;
          document.getElementById("app-root").hidden = true;
        }
        window.__onCourtNoteAccessError = function (error) {
          startedUid = null;
          showLogin();
          errEl.textContent = error && error.code === "permission-denied"
            ? "이 계정은 사용 권한이 없어요. 관리자에게 계정 등록을 요청해주세요."
            : "데이터를 불러오지 못했어요. 연결 상태를 확인한 뒤 새로고침해주세요.";
        };

        // AI 메모 정리 기능(court-note-deploy.html 안의 wireAi())이 이 함수로
        // 로그인 토큰을 받아서 /api/clean-note 서버 함수를 호출해요.
        window.__getIdToken = function () {
          var u = fbAuth.currentUser;
          if (!u || startedUid !== u.uid) return Promise.reject(new Error("not_signed_in"));
          return u.getIdToken();
        };

        fbAuth.onAuthStateChanged(function (user) {
          var current = ++authGeneration;
          startedUid = null;
          window.__stopCourtNoteApp();
          showLogin();
          errEl.textContent = "";
          if (!user) return;
          if (!user.email || !user.emailVerified) {
            errEl.textContent = "이메일 링크로 로그인하여 이메일 인증을 완료해주세요.";
            return;
          }
          errEl.textContent = "계정을 확인하고 있어요…";
          fbDb.collection("admins").doc(user.email).get({ source: "server" })
            .then(function (record) {
              if (current !== authGeneration || !fbAuth.currentUser || fbAuth.currentUser.uid !== user.uid) return;
              if (!record.exists) {
                errEl.textContent = "이 계정은 사용 권한이 없어요. 관리자에게 계정 등록을 요청해주세요.";
                return;
              }
              errEl.textContent = "";
              showApp(user);
            })
            .catch(function () {
              if (current !== authGeneration) return;
              errEl.textContent = "계정 권한을 확인하지 못했어요. 연결 상태를 확인한 뒤 새로고침해주세요.";
            });
        });

        // ---- 이메일 링크(비밀번호 없는) 로그인 ----
        var EMAIL_STORAGE_KEY = "courtNoteEmailForSignIn";

        // 메일 속 링크를 눌러서 이 페이지로 돌아온 경우, 자동으로 로그인을 완료해요.
        if (fbAuth.isSignInWithEmailLink(window.location.href)) {
          var savedEmail = window.localStorage.getItem(EMAIL_STORAGE_KEY);
          var email = savedEmail;
          if (!email) {
            // 로그인 링크를 요청했던 브라우저와 다른 브라우저/기기에서 열었을 때만 물어봐요.
            email = window.prompt(
              "로그인을 완료하려면 이메일 주소를 다시 입력해주세요",
            );
          }
          if (email) {
            fbAuth
              .signInWithEmailLink(email, window.location.href)
              .then(function () {
                window.localStorage.removeItem(EMAIL_STORAGE_KEY);
                window.history.replaceState(
                  {},
                  document.title,
                  window.location.pathname,
                );
              })
              .catch(function (err) {
                errEl.textContent =
                  "로그인 링크가 만료되었거나 잘못됐어요. 다시 요청해주세요.";
                window.history.replaceState(
                  {},
                  document.title,
                  window.location.pathname,
                );
              });
          }
        }

        document
          .getElementById("login-form")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            var email = document.getElementById("login-email").value.trim();
            errEl.textContent = "";
            sentEl.hidden = true;
            if (!email) return;
            submitBtn.disabled = true;
            var actionCodeSettings = {
              url: window.location.href,
              handleCodeInApp: true,
            };
            fbAuth
              .sendSignInLinkToEmail(email, actionCodeSettings)
              .then(function () {
                window.localStorage.setItem(EMAIL_STORAGE_KEY, email);
                sentEl.hidden = false;
              })
              .catch(function (err) {
                var msgMap = {
                  "auth/too-many-requests":
                    "너무 여러 번 시도하셨어요. 몇 분 후 다시 시도해주세요.",
                  "auth/invalid-email": "이메일 주소 형식이 올바르지 않아요.",
                  "auth/unauthorized-continue-uri":
                    "이 주소가 Firebase에 승인된 도메인으로 등록되지 않았어요. Firebase 콘솔 > Authentication > Settings > 승인된 도메인에서 이 주소를 추가해주세요.",
                  "auth/operation-not-allowed":
                    '이메일 링크 로그인이 아직 꺼져있어요. Firebase 콘솔 > Authentication > Sign-in method에서 "이메일 링크(비밀번호가 없는 로그인)"를 켜주세요.',
                  "auth/network-request-failed":
                    "네트워크 연결을 확인해주세요.",
                };
                errEl.textContent =
                  msgMap[err.code] ||
                  "링크 전송에 실패했어요. (" +
                    (err.code || err.message || "알 수 없는 오류") +
                    ")";
              })
              .finally(function () {
                submitBtn.disabled = false;
              });
          });

        document
          .getElementById("btn-logout")
          .addEventListener("click", function () {
            authGeneration += 1;
            startedUid = null;
            window.__stopCourtNoteApp();
            showLogin();
            fbAuth.signOut().catch(function () {
              errEl.textContent = "로그아웃을 완료하지 못했어요. 새로고침 후 다시 시도해주세요.";
            });
          });
        window.addEventListener("pagehide", function () {
          authGeneration += 1;
          startedUid = null;
          window.__stopCourtNoteApp();
          showLogin();
        });
        window.addEventListener("pageshow", function (event) {
          if (event.persisted) window.location.reload();
        });
      })();
    </script>

    <script>
      // PWA: 서비스 워커 등록 (홈 화면 추가/오프라인 최소 지원용)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {
            // 등록 실패해도 앱 사용 자체엔 지장 없음
          });
        });
      }
    </script>
  </body>
