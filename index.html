<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코트노트</title>

    <!-- PWA: 홈 화면에 앱처럼 추가할 수 있게 해주는 설정 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#136354" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="코트노트" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap");

      :root {
        color-scheme: light;
        --bg: #f5f4ee;
        --surface: #ffffff;
        --surface-2: #edf0e9;
        --border: #dce2d6;
        --text: #182420;
        --text-2: #5a6960;
        --text-3: #8b978e;
        --accent: #136354;
        --accent-2: #0d4a3f;
        --accent-soft: #dceee6;
        --ball: #8e9e1e;
        --ball-soft: #f1f4d6;
        --success: #2e7d4f;
        --success-soft: #e3f1e7;
        --warning: #a56a15;
        --warning-soft: #fbf0dd;
        --danger: #aa3b3b;
        --danger-soft: #f8e5e2;
        --shadow:
          0 1px 2px rgba(15, 30, 25, 0.07), 0 6px 16px rgba(15, 30, 25, 0.06);
        --radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0f1613;
          --surface: #161f1a;
          --surface-2: #1c2721;
          --border: #2a3a31;
          --text: #e7eee9;
          --text-2: #9fb0a6;
          --text-3: #71827a;
          --accent: #54d6af;
          --accent-2: #7febc9;
          --accent-soft: #17332c;
          --ball: #d3e14e;
          --ball-soft: #262e17;
          --success: #63c088;
          --success-soft: #17301f;
          --warning: #e3ac52;
          --warning-soft: #332510;
          --danger: #e38585;
          --danger-soft: #3a2020;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.4);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f1613;
        --surface: #161f1a;
        --surface-2: #1c2721;
        --border: #2a3a31;
        --text: #e7eee9;
        --text-2: #9fb0a6;
        --text-3: #71827a;
        --accent: #54d6af;
        --accent-2: #7febc9;
        --accent-soft: #17332c;
        --ball: #d3e14e;
        --ball-soft: #262e17;
        --success: #63c088;
        --success-soft: #17301f;
        --warning: #e3ac52;
        --warning-soft: #332510;
        --danger: #e38585;
        --danger-soft: #3a2020;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Noto Sans KR",
          -apple-system,
          BlinkMacSystemFont,
          "Malgun Gothic",
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: "Noto Sans KR", sans-serif;
        margin: 0;
        text-wrap: balance;
      }
      button {
        font-family: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 14px;
      }
      a {
        color: inherit;
      }

      #app {
        display: flex;
        min-height: 100vh;
      }

      /* ---------- Sidebar (desktop) ---------- */
      #sidebar {
        width: 220px;
        flex: none;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 10px 22px;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(155deg, var(--accent), var(--accent-2));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 14px;
        flex: none;
        box-shadow: var(--shadow);
      }
      .brand-name {
        font-weight: 800;
        font-size: 16.5px;
        letter-spacing: -0.02em;
      }
      .navlist {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .navitem {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 12px;
        border-radius: 9px;
        cursor: pointer;
        color: var(--text-2);
        font-weight: 600;
        font-size: 14px;
        border: 1px solid transparent;
        user-select: none;
      }
      .navitem:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .navitem.active {
        background: var(--accent-soft);
        color: var(--accent-2);
      }
      :root[data-theme="dark"] .navitem.active,
      @media (prefers-color-scheme:dark) {
      }
      .navitem .ic {
        width: 18px;
        text-align: center;
        flex: none;
      }
      .navitem .badge {
        margin-left: auto;
        background: var(--danger);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        border-radius: 20px;
        padding: 1px 6px;
        min-width: 16px;
        text-align: center;
        line-height: 1.5;
      }
      .side-foot {
        margin-top: auto;
        padding: 10px;
        color: var(--text-3);
        font-size: 11.5px;
        line-height: 1.5;
      }

      /* ---------- Main ---------- */
      #main {
        flex: 1;
        min-width: 0;
        padding-bottom: 84px;
      }
      #topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #topbar h1 {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #topbar .sub {
        color: var(--text-2);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .top-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .sync-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-3);
        flex: none;
      }
      .sync-dot.live {
        background: var(--success);
        box-shadow: 0 0 0 3px var(--success-soft);
      }

      .view {
        padding: 20px 24px 40px;
        max-width: 980px;
      }
      .view[hidden] {
        display: none !important;
      }

      /* ---------- Buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-weight: 600;
        font-size: 13.5px;
        padding: 8px 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--text-3);
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-2);
        border-color: var(--accent-2);
      }
      .btn-soft {
        background: var(--accent-soft);
        border-color: transparent;
        color: var(--accent-2);
      }
      .btn-danger {
        background: var(--danger-soft);
        border-color: transparent;
        color: var(--danger);
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 12.5px;
        border-radius: 7px;
      }
      .btn-ghost {
        background: transparent;
        border-color: transparent;
        color: var(--text-2);
      }
      .btn-ghost:hover {
        background: var(--surface-2);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .iconbtn[disabled] {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .iconbtn[disabled]:hover {
        color: var(--text-2);
        border-color: var(--border);
      }
      .drag-handle {
        cursor: grab;
        touch-action: none;
        color: var(--text-3);
        font-size: 16px;
        line-height: 1;
        padding: 8px 4px;
        user-select: none;
        flex: none;
        -webkit-user-select: none;
      }
      .order-num {
        width: 20px;
        flex: none;
        text-align: center;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-3);
        padding-top: 9px;
        user-select: none;
      }
      .drag-handle:active {
        cursor: grabbing;
        color: var(--text);
      }
      [data-drag-item].dragging {
        opacity: 0.9;
      }
      [data-drag-item].dragging > .card {
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
      }
      .btn-block {
        width: 100%;
        justify-content: center;
      }
      .iconbtn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        cursor: pointer;
        flex: none;
      }
      .iconbtn:hover {
        color: var(--text);
        border-color: var(--text-3);
      }

      /* ---------- Cards / layout bits ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card-pad {
        padding: 16px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .grid-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
      }
      .stat .lbl {
        font-size: 12px;
        color: var(--text-2);
        font-weight: 600;
      }
      .stat .val {
        font-size: 23px;
        font-weight: 800;
        margin-top: 4px;
        letter-spacing: -0.02em;
      }
      .stat .val.mono {
        font-size: 20px;
      }

      .section-title {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-2);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 22px 0 10px;
      }
      .section-title:first-child {
        margin-top: 0;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 9px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .pill-accent {
        background: var(--accent-soft);
        color: var(--accent-2);
      }
      .pill-ball {
        background: var(--ball-soft);
        color: var(--ball);
      }
      .pill-success {
        background: var(--success-soft);
        color: var(--success);
      }
      .pill-warning {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .pill-danger {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .pill-muted {
        background: var(--surface-2);
        color: var(--text-2);
      }

      .empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-3);
      }
      .empty .ic {
        font-size: 26px;
        margin-bottom: 8px;
      }
      .empty .t {
        font-weight: 700;
        color: var(--text-2);
        margin-bottom: 4px;
      }

      .lesson-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 14px;
      }
      .lesson-card + .lesson-card {
        margin-top: 10px;
      }
      .lesson-head {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .lesson-time {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 14px;
        color: var(--accent-2);
        flex: none;
        min-width: 50px;
      }
      .lesson-meta {
        flex: 1;
        min-width: 0;
      }
      .lesson-title {
        font-weight: 700;
        font-size: 14.5px;
      }
      .lesson-sub {
        color: var(--text-2);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .mchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 4px 10px 4px 4px;
        font-size: 12.5px;
        font-weight: 600;
        background: var(--surface-2);
        cursor: pointer;
      }
      .mchip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-3);
        flex: none;
      }
      .mchip.done .dot {
        background: var(--success);
      }
      .mchip.absent .dot {
        background: var(--danger);
      }
      .mchip .av {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 800;
        flex: none;
      }
      .lesson-actions {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th {
        text-align: left;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-3);
        font-weight: 700;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .tblwrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .tblwrap table {
        min-width: 640px;
      }

      .progressbar {
        height: 6px;
        border-radius: 4px;
        background: var(--surface-2);
        overflow: hidden;
      }
      .progressbar > i {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 4px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field label {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-2);
      }
      .field input[type="text"],
      .field input[type="number"],
      .field input[type="date"],
      .field input[type="time"],
      .field select,
      .field textarea {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        background: var(--surface);
        color: var(--text);
        width: 100%;
      }
      .field textarea {
        resize: vertical;
        min-height: 64px;
        font-family: inherit;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .fieldgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .seg {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 9px;
        overflow: hidden;
      }
      .seg button {
        flex: 1;
        padding: 9px 8px;
        background: var(--surface);
        border: none;
        border-right: 1px solid var(--border);
        color: var(--text-2);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      .seg button:last-child {
        border-right: none;
      }
      .seg button.on {
        background: var(--accent-soft);
        color: var(--accent-2);
      }
      .checklist {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 6px;
      }
      .checkrow {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 8px;
        border-radius: 7px;
        cursor: pointer;
      }
      .checkrow:hover {
        background: var(--surface-2);
      }
      .checkrow input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }
      .hint {
        font-size: 12px;
        color: var(--text-3);
      }

      /* ---------- Modal ---------- */
      #modal-layer {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
      }
      #modal-layer.open {
        display: block;
      }
      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(10, 15, 12, 0.5);
      }
      .modal-box {
        position: relative;
        max-width: 520px;
        margin: 5vh auto;
        background: var(--surface);
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        max-height: 90vh;
        display: flex;
        flex-direction: column;
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head h3 {
        font-size: 16px;
        font-weight: 800;
      }
      .modal-body {
        padding: 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .modal-foot {
        padding: 14px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      /* ---------- Toast ---------- */
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(0);
        z-index: 200;
        background: var(--text);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(-6px);
      }

      /* ---------- Mobile bottom nav ---------- */
      #bottomnav {
        display: none;
      }
      @media (max-width: 840px) {
        #sidebar {
          display: none;
        }
        #bottomnav {
          display: flex;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 50;
          background: var(--surface);
          border-top: 1px solid var(--border);
          padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        }
        #bottomnav .bn-item {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2px;
          padding: 6px 2px;
          color: var(--text-3);
          font-size: 10.5px;
          font-weight: 700;
          border-radius: 9px;
          position: relative;
        }
        #bottomnav .bn-item .ic {
          font-size: 17px;
        }
        #bottomnav .bn-item.active {
          color: var(--accent);
        }
        #bottomnav .bn-item .badge {
          position: absolute;
          top: 2px;
          right: 22%;
          background: var(--danger);
          color: #fff;
          font-size: 9px;
          border-radius: 20px;
          padding: 0 4px;
          min-width: 13px;
          text-align: center;
          line-height: 1.4;
        }
        .view {
          padding: 16px 14px 24px;
        }
        #topbar {
          padding: 14px 14px;
        }
        .fieldgrid {
          grid-template-columns: 1fr;
        }
        .modal-box {
          margin: 0;
          max-width: 100%;
          height: 100%;
          max-height: 100%;
          border-radius: 0;
        }
      }
    </style>

    <style>
      #login-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        padding: 20px;
      }
      #login-box {
        width: 100%;
        max-width: 360px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 28px;
      }
      #login-box .brand {
        justify-content: center;
        padding: 0 0 18px;
      }
      #login-box h2 {
        font-size: 16px;
        font-weight: 800;
        text-align: center;
        margin-bottom: 4px;
      }
      #login-box .sub {
        text-align: center;
        color: var(--text-2);
        font-size: 12.5px;
        margin-bottom: 20px;
      }
      #login-error {
        color: var(--danger);
        font-size: 12.5px;
        min-height: 16px;
        margin-top: 4px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="login-screen">
      <div id="login-box">
        <div class="brand">
          <div class="brand-mark">CN</div>
          <div class="brand-name">코트노트</div>
        </div>
        <h2>코치 로그인</h2>
        <div class="sub">
          이메일로 로그인 링크를 보내드려요 — 비밀번호가 필요 없어요
        </div>
        <form id="login-form" class="stack">
          <div class="field">
            <label>이메일</label
            ><input
              type="email"
              id="login-email"
              autocomplete="email"
              required
            />
          </div>
          <div id="login-error"></div>
          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="login-submit"
            style="margin-top: 6px"
          >
            로그인 링크 받기
          </button>
        </form>
        <div
          id="login-sent"
          class="hint"
          hidden
          style="margin-top: 14px; text-align: center"
        >
          메일함을 확인해주세요! 방금 보낸 메일 속 링크를 누르면 바로
          로그인돼요.
        </div>
      </div>
    </div>

    <div id="app-root" hidden>
      <div id="app">
        <nav id="sidebar">
          <div class="brand">
            <div class="brand-mark">CN</div>
            <div class="brand-name">코트노트</div>
          </div>
          <div class="navlist" id="navlist-desktop"></div>
          <div class="side-foot">
            피클볼 레슨 기록 · 정산 도구<br />본인 Firebase 프로젝트에 안전하게
            저장됩니다.
          </div>
        </nav>

        <main id="main">
          <header id="topbar">
            <div>
              <h1 id="topbar-title">오늘</h1>
              <div class="sub" id="topbar-sub">&nbsp;</div>
            </div>
            <div class="top-actions">
              <span class="sync-dot" id="sync-dot" title="동기화 상태"></span>
              <button class="iconbtn" id="btn-settings" title="장소 관리">
                ⚙
              </button>
              <button class="iconbtn" id="btn-logout" title="로그아웃">
                🚪
              </button>
            </div>
          </header>

          <section class="view" id="view-today"></section>
          <section class="view" id="view-schedule" hidden></section>
          <section class="view" id="view-members" hidden></section>
          <section class="view" id="view-curriculum" hidden></section>
          <section class="view" id="view-settlement" hidden></section>
        </main>
      </div>

      <nav id="bottomnav"></nav>

      <div id="modal-layer">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-box" id="modal-box"></div>
      </div>

      <div id="toast"></div>
    </div>

    <script src="/coach-session.js"></script>
    <script src="/lesson-completion.js"></script>
    <script>
      (function () {
        "use strict";

        /* ============================= 상수 / 유틸 ============================= */

        var NAV = [
          { id: "today", label: "오늘", ic: "☀" },
          { id: "schedule", label: "일정", ic: "📅" },
          { id: "members", label: "회원", ic: "👥" },
          { id: "curriculum", label: "커리큘럼", ic: "📋" },
          { id: "settlement", label: "정산", ic: "💳" },
        ];

        var KIND_LABEL = { individual: "개인", group: "그룹", club: "클럽" };
        var PROGRAM_LABEL = { regular: "정기", oneday: "원데이" };
        var STAGE_LIST = ["미진행", "연습 중", "수행 가능", "실전 활용 가능"];

        function pad2(n) {
          return (n < 10 ? "0" : "") + n;
        }
        function todayStr() {
          var d = new Date();
          return (
            d.getFullYear() +
            "-" +
            pad2(d.getMonth() + 1) +
            "-" +
            pad2(d.getDate())
          );
        }
        function todayObj() {
          return new Date();
        }
        function fmtDate(iso) {
          if (!iso) return "";
          var p = iso.split("-");
          var d = new Date(+p[0], +p[1] - 1, +p[2]);
          var w = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
          return +p[1] + "월 " + +p[2] + "일 (" + w + ")";
        }
        function fmtDateShort(iso) {
          if (!iso) return "";
          var p = iso.split("-");
          return +p[1] + "/" + +p[2];
        }
        function fmtWon(n) {
          n = Math.round(n || 0);
          return n.toLocaleString("ko-KR") + "원";
        }
        function addDays(iso, n) {
          var p = iso.split("-");
          var d = new Date(+p[0], +p[1] - 1, +p[2]);
          d.setDate(d.getDate() + n);
          return (
            d.getFullYear() +
            "-" +
            pad2(d.getMonth() + 1) +
            "-" +
            pad2(d.getDate())
          );
        }
        function addMinutes(hhmm, mins) {
          var p = hhmm.split(":");
          var total = +p[0] * 60 + +p[1] + mins;
          total = ((total % 1440) + 1440) % 1440;
          return pad2(Math.floor(total / 60)) + ":" + pad2(total % 60);
        }
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
        function uid() {
          return Math.random().toString(36).slice(2, 10);
        }
        function byId(id) {
          return document.getElementById(id);
        }
        function h(html) {
          var t = document.createElement("template");
          t.innerHTML = html.trim();
          return t.content.firstChild;
        }

        function toast(msg) {
          var t = byId("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toast._tm);
          toast._tm = setTimeout(function () {
            t.classList.remove("show");
          }, 2200);
        }

        /* ============================= 상태 ============================= */

        var state = {
          tab: "today",
          db: null,
          coachUid: null,
          sample: null,
          ready: {
            venues: false,
            members: false,
            lessons: false,
            passes: false,
            journals: false,
            skills: false,
            progress: false,
          },
          cache: {
            venues: {},
            members: {},
            lessons: {},
            passes: {},
            journals: {},
            skills: {},
            progress: {},
          },
          memberDetailId: null,
          scheduleShowPast: false,
          scheduleVenueFilter: "all",
        };

        function allReady() {
          for (var k in state.ready) if (!state.ready[k]) return false;
          return true;
        }

        /* ============================= 렌더 라우팅 ============================= */

        var TITLES = {
          today: [
            "오늘",
            function () {
              return fmtDate(todayStr());
            },
          ],
          schedule: [
            "일정",
            function () {
              return "개인·그룹·클럽 레슨 등록 및 관리";
            },
          ],
          members: [
            "회원",
            function () {
              return "연락처, 수강권, 진도, 과제";
            },
          ],
          curriculum: [
            "커리큘럼",
            function () {
              return "과정별 기술 항목과 회원별 숙련도";
            },
          ],
          settlement: [
            "정산",
            function () {
              return "입금·코트비·코치 배분액";
            },
          ],
        };

        function setTab(tab) {
          state.tab = tab;
          state.memberDetailId = null;
          renderNav();
          NAV.forEach(function (n) {
            byId("view-" + n.id).hidden = n.id !== tab;
          });
          byId("topbar-title").textContent = TITLES[tab][0];
          byId("topbar-sub").textContent = TITLES[tab][1]();
          renderAll();
          window.scrollTo(0, 0);
        }

        function renderNav() {
          var desktop = byId("navlist-desktop");
          desktop.innerHTML = "";
          var bottom = byId("bottomnav");
          bottom.innerHTML = "";
          var todayCount = countToday();
          var alertCount = countAlerts();
          NAV.forEach(function (n) {
            var badge = "";
            if (n.id === "today" && todayCount > 0) badge = todayCount;
            if (n.id === "settlement" && alertCount > 0) badge = alertCount;
            var d = h(
              '<div class="navitem' +
                (state.tab === n.id ? " active" : "") +
                '" data-tab="' +
                n.id +
                '"><span class="ic">' +
                n.ic +
                "</span><span>" +
                n.label +
                "</span>" +
                (badge ? '<span class="badge">' + badge + "</span>" : "") +
                "</div>",
            );
            desktop.appendChild(d);
            var b = h(
              '<div class="bn-item' +
                (state.tab === n.id ? " active" : "") +
                '" data-tab="' +
                n.id +
                '"><span class="ic">' +
                n.ic +
                "</span><span>" +
                n.label +
                "</span>" +
                (badge ? '<span class="badge">' + badge + "</span>" : "") +
                "</div>",
            );
            bottom.appendChild(b);
          });
        }

        function countToday() {
          var t = todayStr(),
            c = 0;
          for (var id in state.cache.lessons) {
            var l = state.cache.lessons[id];
            if (l.date === t && l.status !== "canceled") c++;
          }
          return c;
        }
        function countAlerts() {
          var c = 0;
          for (var id in state.cache.passes) {
            if (state.cache.passes[id].status === "ready_settle") c++;
          }
          for (var id in state.cache.lessons) {
            var l = state.cache.lessons[id];
            (l.participants || []).forEach(function (p) {
              if (p.oneday && p.oneday.paid && !p.oneday.settled) c++;
            });
          }
          return c;
        }

        function renderAll() {
          renderNav();
          byId("sync-dot").className = "sync-dot" + (allReady() ? " live" : "");
          if (!allReady()) {
            [
              "today",
              "schedule",
              "members",
              "curriculum",
              "settlement",
            ].forEach(function (t) {
              byId("view-" + t).innerHTML =
                '<div class="empty"><div class="ic">⏳</div><div class="t">불러오는 중…</div><div>잠시만 기다려주세요.</div></div>';
            });
            return;
          }
          renderToday();
          renderSchedule();
          renderMembers();
          renderCurriculum();
          renderSettlement();
        }

        /* ============================= 공용 조회 헬퍼 ============================= */

        function membersArr() {
          return Object.keys(state.cache.members)
            .map(function (id) {
              return Object.assign({ id: id }, state.cache.members[id]);
            })
            .sort(function (a, b) {
              return (a.name || "").localeCompare(b.name || "", "ko");
            });
        }
        function venuesArr() {
          return Object.keys(state.cache.venues)
            .map(function (id) {
              return Object.assign({ id: id }, state.cache.venues[id]);
            })
            .sort(function (a, b) {
              return (a.order || 0) - (b.order || 0);
            });
        }
        function skillsArr() {
          return Object.keys(state.cache.skills)
            .map(function (id) {
              return Object.assign({ id: id }, state.cache.skills[id]);
            })
            .sort(function (a, b) {
              return (a.order || 0) - (b.order || 0);
            });
        }
        /* 커리큘럼: 최상위(그룹 또는 소속 없는 일반 항목) + 그룹별 하위 항목 */
        function topLevelSkills() {
          return skillsArr().filter(function (s) {
            return !s.parentId;
          });
        }
        function childSkills(groupId) {
          return skillsArr().filter(function (s) {
            return s.parentId === groupId;
          });
        }
        function groupSkills() {
          return skillsArr().filter(function (s) {
            return s.isGroup;
          });
        }
        /* 진도 UI에 노출할 "리프(leaf)" 항목만 — 그룹 자체는 진도를 갖지 않는다 */
        function leafSkillsFlat() {
          var out = [];
          topLevelSkills().forEach(function (s) {
            if (s.isGroup) {
              childSkills(s.id).forEach(function (c) {
                out.push(c);
              });
            } else {
              out.push(s);
            }
          });
          return out;
        }
        function lessonsArr() {
          return Object.keys(state.cache.lessons).map(function (id) {
            return Object.assign({ id: id }, state.cache.lessons[id]);
          });
        }
        function passesArr() {
          return Object.keys(state.cache.passes).map(function (id) {
            return Object.assign({ id: id }, state.cache.passes[id]);
          });
        }
        function memberName(id) {
          var m = state.cache.members[id];
          return m ? m.name : "(삭제된 회원)";
        }
        function venueName(id) {
          var v = state.cache.venues[id];
          return v ? v.name : "(장소)";
        }
        function venueRate(id) {
          var v = state.cache.venues[id];
          return v ? v.feeRatePercent || 0 : 0;
        }
        function initial(name) {
          return (name || "?").trim().slice(0, 1);
        }

        function avatarAv(id, size) {
          return '<span class="av">' + esc(initial(memberName(id))) + "</span>";
        }

        function memberPassesActive(memberId) {
          return passesArr().filter(function (p) {
            return p.memberId === memberId && p.status !== "settled";
          });
        }

        /* ============================= 오늘 ============================= */

        function renderToday() {
          var el = byId("view-today");
          var t = todayStr();
          var todays = lessonsArr()
            .filter(function (l) {
              return l.date === t && l.status !== "canceled";
            })
            .sort(function (a, b) {
              return (a.time || "").localeCompare(b.time || "");
            });

          var readyPasses = passesArr().filter(function (p) {
            return p.status === "ready_settle";
          });
          var onedayUnsettled = [];
          lessonsArr().forEach(function (l) {
            (l.participants || []).forEach(function (p) {
              if (p.oneday && p.oneday.paid && !p.oneday.settled) {
                onedayUnsettled.push({ lesson: l, part: p });
              }
            });
          });
          var pendingHomework = 0;
          for (var jid in state.cache.journals) {
            if (state.cache.journals[jid].homeworkStatus === "pending")
              pendingHomework++;
          }

          var html = "";
          html +=
            '<div class="grid-stats">' +
            stat("오늘 레슨", todays.length + "건") +
            stat(
              "정산 대기",
              readyPasses.length + onedayUnsettled.length + "건",
            ) +
            stat("미확인 과제", pendingHomework + "건") +
            "</div>";

          html += '<div class="section-title">오늘의 레슨</div>';
          if (todays.length === 0) {
            html += emptyBlock(
              "🏓",
              "오늘 등록된 레슨이 없어요",
              "일정 탭에서 새 레슨을 등록해보세요.",
            );
          } else {
            html += todays.map(lessonCardHtml).join("");
          }

          if (readyPasses.length || onedayUnsettled.length) {
            html +=
              '<div class="section-title">정산 대기 · 코트비 입금</div><div class="stack">';
            readyPasses.forEach(function (p) {
              html += settlementRowHtml({
                name: memberName(p.memberId),
                venue: venueName(p.venueId),
                tag: "정기 4회 완료",
                dueDate: p.readyDate,
                amount: p.courtFeeAmount,
                action: "settle-pass",
                dataAttrs: 'data-id="' + p.id + '"',
              });
            });
            onedayUnsettled.forEach(function (x) {
              html += settlementRowHtml({
                name: memberName(x.part.memberId),
                venue: venueName(x.lesson.venueId),
                tag: "원데이",
                dueDate: x.lesson.date,
                amount: x.part.oneday.courtFeeAmount,
                action: "settle-oneday",
                dataAttrs:
                  'data-lesson="' +
                  x.lesson.id +
                  '" data-member="' +
                  x.part.memberId +
                  '"',
              });
            });
            html += "</div>";
          }

          if (pendingHomework > 0) {
            html +=
              '<div class="section-title">확인할 과제</div><div class="stack">';
            for (var jid2 in state.cache.journals) {
              var j = state.cache.journals[jid2];
              if (j.homeworkStatus !== "pending" || !j.homework) continue;
              html +=
                '<div class="card card-pad row">' +
                '<div style="flex:1"><b>' +
                esc(memberName(j.memberId)) +
                '</b><div class="hint">' +
                esc(j.homework) +
                "</div></div>" +
                '<button class="btn btn-sm btn-ghost" data-action="homework-done" data-id="' +
                jid2 +
                '">완료 처리</button>' +
                "</div>";
            }
            html += "</div>";
          }

          el.innerHTML = html;
        }

        function stat(lbl, val) {
          return (
            '<div class="stat"><div class="lbl">' +
            lbl +
            '</div><div class="val mono">' +
            val +
            "</div></div>"
          );
        }
        function emptyBlock(ic, t, d) {
          return (
            '<div class="empty"><div class="ic">' +
            ic +
            '</div><div class="t">' +
            t +
            "</div><div>" +
            d +
            "</div></div>"
          );
        }

        function settlementRowHtml(x) {
          var t = todayStr();
          var duePill;
          if (!x.dueDate) {
            duePill = '<span class="pill pill-muted">입금 예정일 미정</span>';
          } else if (x.dueDate < t) {
            duePill =
              '<span class="pill pill-danger">기한 지남 · ' +
              fmtDateShort(x.dueDate) +
              "</span>";
          } else if (x.dueDate === t) {
            duePill =
              '<span class="pill pill-warning">오늘 입금 · ' +
              fmtDateShort(x.dueDate) +
              "</span>";
          } else {
            duePill =
              '<span class="pill pill-muted">입금 예정 · ' +
              fmtDateShort(x.dueDate) +
              "</span>";
          }
          return (
            '<div class="card card-pad">' +
            '<div class="row" style="flex-wrap:wrap;gap:6px"><b>' +
            esc(x.name) +
            "</b> · " +
            esc(x.venue) +
            ' <span class="pill pill-muted">' +
            esc(x.tag) +
            "</span>" +
            duePill +
            "</div>" +
            '<div class="row" style="margin-top:8px"><span class="hint">보낼 코트비</span><span class="mono" style="margin-left:auto;font-weight:800;font-size:15px">' +
            fmtWon(x.amount) +
            "</span></div>" +
            '<div class="lesson-actions"><button class="btn btn-soft btn-sm" data-action="' +
            x.action +
            '" ' +
            x.dataAttrs +
            ">코트비 지급 완료</button></div>" +
            "</div>"
          );
        }

        function lessonCardHtml(l) {
          var parts = l.participants || [];
          var statusPill =
            l.status === "done"
              ? '<span class="pill pill-success">완료</span>'
              : '<span class="pill pill-accent">예정</span>';
          var kindPill =
            '<span class="pill pill-muted">' +
            KIND_LABEL[l.kind] +
            " · " +
            PROGRAM_LABEL[l.programType] +
            "</span>";
          var timeLabel = l.time || "--:--";
          var subLine = esc(venueName(l.venueId));
          if (l.kind === "club" && l.clubStartTime) {
            subLine += " · 회원당 20분 순차";
          }

          var chips = parts
            .map(function (p, idx) {
              var t =
                l.kind === "club"
                  ? addMinutes(l.clubStartTime || l.time, idx * 20)
                  : null;
              var cls =
                p.attendance === "done"
                  ? "done"
                  : p.attendance === "absent"
                    ? "absent"
                    : "";
              return (
                '<span class="mchip ' +
                cls +
                '" data-action="cycle-attendance" data-lesson="' +
                l.id +
                '" data-member="' +
                p.memberId +
                '">' +
                (t
                  ? '<b class="mono" style="font-size:11px">' + t + "</b>"
                  : '<span class="dot"></span>') +
                esc(memberName(p.memberId)) +
                "</span>"
              );
            })
            .join("");

          var actions = "";
          if (l.status !== "done") {
            actions +=
              '<button class="btn btn-primary btn-sm" data-action="complete-lesson" data-id="' +
              l.id +
              '">수업 완료 처리</button>';
          }
          actions +=
            '<button class="btn btn-ghost btn-sm" data-action="open-journal" data-id="' +
            l.id +
            '">일지 작성</button>';
          if (l.status !== "canceled") {
            actions +=
              '<button class="btn btn-ghost btn-sm" data-action="cancel-lesson" data-id="' +
              l.id +
              '">전체 레슨 취소</button>';
          }

          return (
            '<div class="lesson-card">' +
            '<div class="lesson-head">' +
            '<div class="lesson-time">' +
            timeLabel +
            "</div>" +
            '<div class="lesson-meta"><div class="lesson-title">' +
            esc(venueName(l.venueId)) +
            " · " +
            KIND_LABEL[l.kind] +
            " 레슨</div>" +
            '<div class="lesson-sub">' +
            subLine +
            "</div></div>" +
            '<div class="row" style="gap:6px">' +
            kindPill +
            statusPill +
            "</div>" +
            "</div>" +
            '<div class="chip-row">' +
            chips +
            "</div>" +
            '<div class="hint" style="margin-top:6px">회원 이름을 탭하면 그 회원만 예정→완료→결석 순으로 바뀌어요. 결석으로 표시된 회원은 수강권 횟수가 차감되지 않아요.</div>' +
            '<div class="lesson-actions">' +
            actions +
            "</div>" +
            "</div>"
          );
        }

        /* ============================= 일정 ============================= */

        function renderSchedule() {
          var el = byId("view-schedule");
          var venOpts =
            '<option value="all">전체 장소</option>' +
            venuesArr()
              .map(function (v) {
                return (
                  '<option value="' + v.id + '">' + esc(v.name) + "</option>"
                );
              })
              .join("");

          var list = lessonsArr();
          var t = todayStr();
          list = list.filter(function (l) {
            return state.scheduleShowPast || l.date >= t;
          });
          if (state.scheduleVenueFilter !== "all")
            list = list.filter(function (l) {
              return l.venueId === state.scheduleVenueFilter;
            });
          list.sort(function (a, b) {
            return (a.date + a.time).localeCompare(b.date + b.time);
          });

          var html =
            '<div class="row" style="flex-wrap:wrap;margin-bottom:14px">' +
            '<button class="btn btn-primary" data-action="new-lesson">+ 새 레슨 등록</button>' +
            '<select id="sched-venue-filter" class="btn btn-sm" style="padding:7px 10px">' +
            venOpts +
            "</select>" +
            '<label class="hint row" style="gap:5px;cursor:pointer;margin-left:auto"><input type="checkbox" id="sched-past-toggle" ' +
            (state.scheduleShowPast ? "checked" : "") +
            "> 지난 일정도 보기</label>" +
            "</div>";

          if (list.length === 0) {
            html += emptyBlock(
              "📅",
              "등록된 일정이 없어요",
              "새 레슨을 등록해서 시작해보세요.",
            );
          } else {
            var byDate = {};
            var order = [];
            list.forEach(function (l) {
              if (!byDate[l.date]) {
                byDate[l.date] = [];
                order.push(l.date);
              }
              byDate[l.date].push(l);
            });
            order.forEach(function (date) {
              html +=
                '<div class="section-title">' +
                fmtDate(date) +
                (date === t ? " · 오늘" : "") +
                '</div><div class="stack">';
              html += byDate[date].map(lessonCardHtml).join("");
              html += "</div>";
            });
          }
          el.innerHTML = html;
          var vf = byId("sched-venue-filter");
          if (vf) vf.value = state.scheduleVenueFilter;
          var pf = byId("sched-past-toggle");
          if (vf)
            vf.onchange = function () {
              state.scheduleVenueFilter = vf.value;
              renderSchedule();
            };
          if (pf)
            pf.onchange = function () {
              state.scheduleShowPast = pf.checked;
              renderSchedule();
            };
        }

        /* ============================= 회원 ============================= */

        function renderMembers() {
          var el = byId("view-members");
          if (state.memberDetailId) {
            renderMemberDetail(el, state.memberDetailId);
            return;
          }

          var arr = membersArr();
          var html =
            '<div class="row" style="margin-bottom:14px"><button class="btn btn-primary" data-action="new-member">+ 새 회원 추가</button></div>';

          if (arr.length === 0) {
            html += emptyBlock(
              "👥",
              "등록된 회원이 없어요",
              "새 회원을 추가하면 여기에 표시돼요.",
            );
          } else {
            html += '<div class="stack">';
            arr.forEach(function (m) {
              var passes = memberPassesActive(m.id);
              var activePass = passes.find(function (p) {
                return p.status === "active";
              });
              var progressLine = activePass
                ? activePass.usedCount +
                  " / " +
                  activePass.totalCount +
                  "회 · " +
                  esc(venueName(activePass.venueId))
                : "진행중인 수강권 없음";
              html +=
                '<div class="card card-pad row" style="cursor:pointer" data-action="open-member" data-id="' +
                m.id +
                '">' +
                '<span class="av" style="width:34px;height:34px;font-size:13px">' +
                esc(initial(m.name)) +
                "</span>" +
                '<div style="flex:1;min-width:0">' +
                '<div style="font-weight:700">' +
                esc(m.name) +
                "</div>" +
                '<div class="hint">' +
                esc(m.club || "소속 클럽 없음") +
                (m.phone ? " · " + esc(m.phone) : "") +
                "</div>" +
                "</div>" +
                '<div class="hint mono" style="text-align:right">' +
                progressLine +
                "</div>" +
                "</div>";
            });
            html += "</div>";
          }
          el.innerHTML = html;
        }

        function renderMemberDetail(el, id) {
          var m = state.cache.members[id];
          if (!m) {
            state.memberDetailId = null;
            renderMembers();
            return;
          }
          var passes = passesArr()
            .filter(function (p) {
              return p.memberId === id;
            })
            .sort(function (a, b) {
              return (b.createdAt || "").localeCompare(a.createdAt || "");
            });
          var myLessons = lessonsArr()
            .filter(function (l) {
              return (l.participants || []).some(function (p) {
                return p.memberId === id;
              });
            })
            .sort(function (a, b) {
              return (b.date + b.time).localeCompare(a.date + a.time);
            });

          var html =
            '<button class="btn btn-ghost btn-sm" data-action="back-members" style="margin-bottom:14px">← 회원 목록</button>';
          html +=
            '<div class="card card-pad row" style="align-items:flex-start">' +
            '<span class="av" style="width:44px;height:44px;font-size:16px">' +
            esc(initial(m.name)) +
            "</span>" +
            '<div style="flex:1">' +
            '<div style="font-weight:800;font-size:17px">' +
            esc(m.name) +
            "</div>" +
            '<div class="hint">' +
            esc(m.club || "소속 클럽 없음") +
            (m.phone ? " · " + esc(m.phone) : "") +
            "</div>" +
            (m.memo
              ? '<div class="hint" style="margin-top:6px">' +
                esc(m.memo) +
                "</div>"
              : "") +
            "</div>" +
            '<button class="iconbtn" data-action="edit-member" data-id="' +
            id +
            '" title="수정">✎</button>' +
            "</div>";

          html += '<div class="section-title">수강권</div>';
          if (passes.length === 0) {
            html += emptyBlock(
              "🎟",
              "수강권이 없어요",
              "일정 탭에서 레슨을 등록하면 자동으로 생성돼요.",
            );
          } else {
            html +=
              '<div class="stack">' +
              passes
                .map(function (p) {
                  var pct = Math.round(
                    (100 * (p.usedCount || 0)) / (p.totalCount || 1),
                  );
                  var stPill =
                    p.status === "settled"
                      ? '<span class="pill pill-muted">정산완료</span>'
                      : p.status === "ready_settle"
                        ? '<span class="pill pill-warning">정산대기</span>'
                        : '<span class="pill pill-accent">진행중</span>';
                  return (
                    '<div class="card card-pad">' +
                    '<div class="row"><b>' +
                    esc(venueName(p.venueId)) +
                    "</b> · 정기 " +
                    p.totalCount +
                    "회" +
                    " " +
                    stPill +
                    '<span class="mono" style="margin-left:auto;font-weight:700">' +
                    fmtWon(p.paidAmount) +
                    "</span></div>" +
                    '<div class="progressbar" style="margin-top:9px"><i style="width:' +
                    pct +
                    '%"></i></div>' +
                    '<div class="hint" style="margin-top:6px">사용 ' +
                    (p.usedCount || 0) +
                    " / " +
                    p.totalCount +
                    "회 · 코트비 " +
                    fmtWon(p.courtFeeAmount) +
                    " · 코치 배분액 " +
                    fmtWon(p.coachAmount) +
                    "</div>" +
                    "</div>"
                  );
                })
                .join("") +
              "</div>";
          }

          html += '<div class="section-title">레슨 기록</div>';
          if (myLessons.length === 0) {
            html += emptyBlock("📝", "기록된 레슨이 없어요", "", "");
          } else {
            html +=
              '<div class="stack">' +
              myLessons
                .slice(0, 20)
                .map(function (l) {
                  var j = state.cache.journals[l.id + "__" + id];
                  var myPart = (l.participants || []).find(function (pp) {
                    return pp.memberId === id;
                  });
                  var att = myPart ? myPart.attendance : null;
                  var statusPill;
                  if (l.status === "canceled") {
                    statusPill =
                      '<span class="pill pill-muted">전체취소</span>';
                  } else if (att === "absent") {
                    statusPill = '<span class="pill pill-danger">결석</span>';
                  } else if (att === "done") {
                    statusPill = '<span class="pill pill-success">완료</span>';
                  } else {
                    statusPill = '<span class="pill pill-accent">예정</span>';
                  }
                  var bodyLine;
                  if (att === "absent") {
                    bodyLine =
                      '<div class="hint" style="margin-top:6px">결석 처리됨' +
                      (j && j.content ? " · " + esc(j.content) : "") +
                      "</div>";
                  } else if (j && j.content) {
                    bodyLine =
                      '<div class="hint" style="margin-top:6px">' +
                      esc(j.content) +
                      "</div>";
                  } else {
                    bodyLine =
                      '<div class="hint" style="margin-top:6px">기록 없음 — 눌러서 작성</div>';
                  }
                  return (
                    '<div class="card card-pad" data-action="open-journal-for" data-lesson="' +
                    l.id +
                    '" data-member="' +
                    id +
                    '" style="cursor:pointer">' +
                    '<div class="row"><b class="mono">' +
                    fmtDateShort(l.date) +
                    '</b><span class="pill pill-muted">' +
                    KIND_LABEL[l.kind] +
                    "</span>" +
                    statusPill +
                    "</div>" +
                    bodyLine +
                    "</div>"
                  );
                })
                .join("") +
              "</div>";
          }

          function progressRowHtml(s) {
            var pr = state.cache.progress[id + "__" + s.id];
            var stage = pr ? pr.stage : STAGE_LIST[0];
            var stageIdx = STAGE_LIST.indexOf(stage);
            return (
              "<div>" +
              '<div class="row"><b style="font-size:13.5px">' +
              esc(s.title) +
              "</b></div>" +
              '<div class="seg" style="margin-top:6px">' +
              STAGE_LIST.map(function (st, i) {
                return (
                  '<button class="' +
                  (i === stageIdx ? "on" : "") +
                  '" data-action="set-progress" data-member="' +
                  id +
                  '" data-skill="' +
                  s.id +
                  '" data-stage="' +
                  esc(st) +
                  '">' +
                  st +
                  "</button>"
                );
              }).join("") +
              "</div>" +
              "</div>"
            );
          }
          html +=
            '<div class="section-title">기술 진도</div><div class="card card-pad stack">' +
            topLevelSkills()
              .map(function (s) {
                if (s.isGroup) {
                  var kids = childSkills(s.id);
                  return (
                    '<div class="stack" style="gap:10px">' +
                    '<div class="hint" style="font-weight:700;text-transform:none;letter-spacing:0">' +
                    esc(s.title) +
                    "</div>" +
                    (kids.length
                      ? '<div class="stack" style="gap:10px;padding-left:12px;border-left:2px solid var(--border)">' +
                        kids.map(progressRowHtml).join("") +
                        "</div>"
                      : '<div class="hint" style="padding-left:12px">하위 항목이 없어요.</div>') +
                    "</div>"
                  );
                }
                return progressRowHtml(s);
              })
              .join("") +
            (topLevelSkills().length === 0
              ? '<div class="hint">커리큘럼 탭에서 기술 항목을 먼저 추가하세요.</div>'
              : "") +
            "</div>";

          el.innerHTML = html;
        }

        /* ============================= 커리큘럼 ============================= */

        function curriculumRowHtml(s, num) {
          return (
            '<div class="card card-pad row" style="gap:8px;align-items:flex-start">' +
            '<div class="order-num mono" data-order-badge>' +
            num +
            "</div>" +
            '<div class="drag-handle" data-drag-handle title="드래그해서 순서 변경">⠿</div>' +
            '<div style="flex:1;min-width:0">' +
            '<div class="row" style="gap:6px;flex-wrap:wrap"><b>' +
            esc(s.title) +
            "</b>" +
            (s.isGroup ? '<span class="pill pill-accent">그룹</span>' : "") +
            "</div>" +
            (s.memo
              ? '<div class="hint" style="margin-top:2px">' +
                esc(s.memo) +
                "</div>"
              : "") +
            "</div>" +
            '<div class="row" style="gap:6px">' +
            '<button class="iconbtn" data-action="edit-skill" data-id="' +
            s.id +
            '" title="수정">✎</button>' +
            '<button class="iconbtn" data-action="delete-skill" data-id="' +
            s.id +
            '" title="삭제">✕</button>' +
            "</div>" +
            "</div>"
          );
        }

        function renderCurriculum() {
          var el = byId("view-curriculum");
          var top = topLevelSkills();
          var html =
            '<div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:8px">' +
            '<button class="btn btn-primary" data-action="new-skill">+ 항목 추가</button>' +
            '<button class="btn btn-soft" data-action="new-skill-group">+ 그룹 추가</button>' +
            "</div>";
          if (top.length === 0) {
            html += emptyBlock(
              "📋",
              "등록된 커리큘럼이 없어요",
              "예: 서브·리턴, 딩크, 발리, 드롭샷, 경기 운영 — 딩크처럼 세부 종류가 많으면 그룹으로 묶어서 관리할 수 있어요.",
            );
          } else {
            html += '<div class="stack" data-zone="root">';
            top.forEach(function (s, i) {
              if (s.isGroup) {
                var kids = childSkills(s.id);
                html +=
                  '<div class="stack" style="gap:10px" data-drag-item data-is-group="1" data-id="' +
                  s.id +
                  '" data-parent="root">';
                html += curriculumRowHtml(s, i + 1);
                html +=
                  '<div class="stack" style="gap:10px;padding-left:16px;border-left:2px solid var(--border);margin-left:10px" data-zone="child-' +
                  s.id +
                  '">';
                kids.forEach(function (c, j) {
                  html +=
                    '<div data-drag-item data-is-group="0" data-id="' +
                    c.id +
                    '" data-parent="' +
                    s.id +
                    '">' +
                    curriculumRowHtml(c, j + 1) +
                    "</div>";
                });
                html +=
                  '<button class="btn btn-ghost btn-sm" data-action="new-skill-in-group" data-group="' +
                  s.id +
                  '" style="align-self:flex-start">+ ' +
                  esc(s.title) +
                  "에 항목 추가</button>";
                html += "</div>";
                html += "</div>";
              } else {
                html +=
                  '<div data-drag-item data-is-group="0" data-id="' +
                  s.id +
                  '" data-parent="root">' +
                  curriculumRowHtml(s, i + 1) +
                  "</div>";
              }
            });
            html += "</div>";
            html +=
              '<div class="hint" style="margin-top:10px">진도 단계: ' +
              STAGE_LIST.join(" → ") +
              ". 회원별 진도는 회원 상세 화면에서 기록합니다. 항목 왼쪽의 ⠿ 을 눌러 드래그하면 순서를 바꿀 수 있고, 다른 그룹 위에 놓으면 그 그룹으로 옮길 수 있어요(그룹 자체는 항상 최상위에만 있어요).</div>";
          }
          el.innerHTML = html;
        }

        /* ============================= 정산 ============================= */

        function renderSettlement() {
          var el = byId("view-settlement");

          var rows = [];
          passesArr().forEach(function (p) {
            rows.push({
              type: "regular",
              memberId: p.memberId,
              venueId: p.venueId,
              label: "정기 " + p.totalCount + "회",
              amount: p.paidAmount,
              date: p.paidDate,
              progress: (p.usedCount || 0) + "/" + p.totalCount,
              courtFee: p.courtFeeAmount,
              coach: p.coachAmount,
              status: p.status,
              onSettle:
                p.status === "ready_settle"
                  ? { action: "settle-pass", id: p.id }
                  : null,
            });
          });
          lessonsArr().forEach(function (l) {
            (l.participants || []).forEach(function (p) {
              if (!p.oneday) return;
              rows.push({
                type: "oneday",
                memberId: p.memberId,
                venueId: l.venueId,
                label: "원데이",
                amount: p.oneday.amount,
                date: l.date,
                progress: p.oneday.paid ? "입금완료" : "미입금",
                courtFee: p.oneday.courtFeeAmount,
                coach: p.oneday.coachAmount,
                status: p.oneday.settled
                  ? "settled"
                  : p.oneday.paid
                    ? "ready_settle"
                    : "unpaid",
                onSettle:
                  p.oneday.paid && !p.oneday.settled
                    ? {
                        action: "settle-oneday",
                        lesson: l.id,
                        member: p.memberId,
                      }
                    : null,
                onPay: !p.oneday.paid
                  ? { action: "mark-paid", lesson: l.id, member: p.memberId }
                  : null,
              });
            });
          });
          rows.sort(function (a, b) {
            return (b.date || "").localeCompare(a.date || "");
          });

          var totalReceived = 0,
            totalUnpaid = 0,
            totalCourtDue = 0,
            totalCoach = 0;
          rows.forEach(function (r) {
            if (r.status !== "unpaid") totalReceived += r.amount || 0;
            if (r.status === "unpaid") totalUnpaid += r.amount || 0;
            if (r.onSettle) totalCourtDue += r.courtFee || 0;
            if (r.status !== "unpaid") totalCoach += r.coach || 0;
          });

          var html =
            '<div class="grid-stats">' +
            stat("받은 회비", fmtWon(totalReceived)) +
            stat("미입금", fmtWon(totalUnpaid)) +
            stat("지급 대기 코트비", fmtWon(totalCourtDue)) +
            stat("코치 배분액", fmtWon(totalCoach)) +
            "</div>";

          html += '<div class="section-title">정산 내역</div>';
          if (rows.length === 0) {
            html += emptyBlock("💳", "정산 항목이 없어요", "", "");
          } else {
            html +=
              '<div class="tblwrap"><table><thead><tr><th>회원</th><th>장소</th><th>유형</th><th>일자</th><th>입금액</th><th>진행</th><th>코트비</th><th>코치배분</th><th>상태</th><th></th></tr></thead><tbody>';
            rows.forEach(function (r) {
              var stPill =
                r.status === "settled"
                  ? '<span class="pill pill-muted">완료</span>'
                  : r.status === "ready_settle"
                    ? '<span class="pill pill-warning">정산대기</span>'
                    : r.status === "unpaid"
                      ? '<span class="pill pill-danger">미입금</span>'
                      : '<span class="pill pill-accent">진행중</span>';
              var actionBtn = "";
              if (r.onPay)
                actionBtn =
                  '<button class="btn btn-sm btn-soft" data-action="' +
                  r.onPay.action +
                  '" data-lesson="' +
                  r.onPay.lesson +
                  '" data-member="' +
                  r.onPay.member +
                  '">입금 확인</button>';
              else if (r.onSettle)
                actionBtn =
                  '<button class="btn btn-sm btn-soft" data-action="' +
                  r.onSettle.action +
                  '" ' +
                  (r.onSettle.id ? 'data-id="' + r.onSettle.id + '"' : "") +
                  (r.onSettle.lesson
                    ? 'data-lesson="' +
                      r.onSettle.lesson +
                      '" data-member="' +
                      r.onSettle.member +
                      '"'
                    : "") +
                  ">코트비 지급</button>";
              html +=
                "<tr><td>" +
                esc(memberName(r.memberId)) +
                "</td><td>" +
                esc(venueName(r.venueId)) +
                "</td><td>" +
                r.label +
                "</td>" +
                '<td class="mono">' +
                fmtDateShort(r.date) +
                '</td><td class="mono">' +
                fmtWon(r.amount) +
                '</td><td class="mono">' +
                r.progress +
                "</td>" +
                '<td class="mono">' +
                fmtWon(r.courtFee) +
                '</td><td class="mono">' +
                fmtWon(r.coach) +
                "</td><td>" +
                stPill +
                "</td><td>" +
                actionBtn +
                "</td></tr>";
            });
            html += "</tbody></table></div>";
          }
          el.innerHTML = html;
        }

        /* ============================= 모달 ============================= */

        function openModal(title, bodyHtml, footHtml) {
          byId("modal-box").innerHTML =
            '<div class="modal-head"><h3>' +
            title +
            '</h3><button class="iconbtn" style="margin-left:auto" data-action="close-modal">✕</button></div>' +
            '<div class="modal-body">' +
            bodyHtml +
            "</div>" +
            (footHtml ? '<div class="modal-foot">' + footHtml + "</div>" : "");
          byId("modal-layer").classList.add("open");
        }
        function closeModal() {
          byId("modal-layer").classList.remove("open");

              memberChecklist() +
              '<button class="btn btn-sm btn-ghost" id="btn-quick-member" type="button" style="align-self:flex-start">+ 새 회원 바로 추가</button>' +
              "</div>" +
              '<div id="repeat-wrap" class="field" style="display:none">' +
              '<label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" id="f-repeat"> 매주 반복 등록 (정기 4회분 자동 생성)</label>' +

                        existing.totalCount +
                        "회, ID " +

                        ")</div>"
                      );

                      '<div class="card card-pad" style="margin-bottom:8px">' +
                      '<b style="font-size:13px">' +

                      '<div class="field"><label>선납 금액</label><input type="number" class="pay-amount" data-member="' +
                      mid +
                      '" value="200000"></div>' +
                      '<div class="field"><label>입금일</label><input type="date" class="pay-date" data-member="' +
                      mid +
                      '" value="' +
                      todayStr() +
                      '"></div>' +
                      "</div>" +
                      (rate > 0
                        ? '<div class="hint" style="margin-top:6px">코트비 예정 ' +
                          rate +
                          "% · 코치 배분액은 자동 계산됩니다.</div>"
                        : "") +
                      "</div>"
                    );
                  })
                  .join("");
            } else {
              wrap.innerHTML =
                '<div class="section-title" style="margin:4px 0 8px">회원별 원데이 회비</div>' +
                selectedMembers
                  .map(function (mid) {
                    return (
                      '<div class="card card-pad" style="margin-bottom:8px">' +
                      '<b style="font-size:13px">' +
                      esc(memberName(mid)) +
                      "</b>" +
                      '<div class="fieldgrid" style="margin-top:8px">' +
                      '<div class="field"><label>참가비</label><input type="number" class="pay-amount" data-member="' +
                      mid +
                      '" value="50000"></div>' +
                      '<div class="field"><label>입금 여부</label><select class="pay-paid" data-member="' +

                      '"><option value="0">수업 후 수납 예정</option><option value="1">이미 입금됨</option></select></div>' +

          byId("seg-kind").onclick = function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            chosenKind = b.dataset.v;
            [].forEach.call(byId("seg-kind").children, function (c) {
              c.classList.toggle("on", c === b);
            });
          };
          byId("seg-program").onclick = function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            chosenProgram = b.dataset.v;
            [].forEach.call(byId("seg-program").children, function (c) {
              c.classList.toggle("on", c === b);
            });
            updateHints();
          };
          byId("modal-box").addEventListener("change", function (e) {
            if (e.target.classList.contains("pick-member")) {
              var v = e.target.value,
                on = e.target.checked;
              var idx = selectedMembers.indexOf(v);
              if (on && idx < 0) selectedMembers.push(v);
              if (!on && idx >= 0) selectedMembers.splice(idx, 1);
              renderPayWrap();
            }
            if (e.target.id === "f-venue") {
              renderPayWrap();
            }
          });
          byId("btn-quick-member").onclick = function () {
            modalNewMember(function (newId) {
              selectedMembers.push(newId);
              modalNewLesson._reopen && modalNewLesson._reopen();
            });
            modalNewLesson._pending = {
              chosenKind: chosenKind,
              chosenProgram: chosenProgram,
              selectedMembers: selectedMembers,
            };
          };

          updateHints();

          byId("save-lesson").onclick = function () {
            var venue = byId("f-venue").value;
            var date = byId("f-date").value,
              time = byId("f-time").value;
            if (!venue) {
              toast("장소를 먼저 등록해주세요");
              return;
            }
            if (selectedMembers.length === 0) {
              toast("참여 회원을 선택해주세요");
              return;
            }
            if (!date || !time) {
              toast("날짜와 시간을 입력해주세요");
              return;
            }

            var rate = venueRate(venue);
            var repeatOn = byId("f-repeat") && byId("f-repeat").checked;

            buildParticipantsAndPasses(
              selectedMembers,
              chosenProgram,
              venue,
              rate,
            ).then(function (participants) {
              var count = repeatOn && chosenProgram === "regular" ? 4 : 1;
              var writes = [];
              for (var i = 0; i < count; i++) {
                writes.push(
                  state.db.collection("lessons").add({
                    date: addDays(date, i * 7),
                    time: time,
                    venueId: venue,
                    kind: chosenKind,
                    programType: chosenProgram,
                    clubStartTime: chosenKind === "club" ? time : null,
                    participants: participants.map(function (p) {
                      return Object.assign({}, p, { attendance: "scheduled" });
                    }),
                    status: "scheduled",
                    createdAt: new Date().toISOString(),
                  }),
                );
              }
              Promise.all(writes).then(function () {
                toast(
                  count > 1
                    ? "레슨 " + count + "건을 등록했어요"
                    : "레슨을 등록했어요",
                );
                closeModal();
              });
            });
          };
        }

        function buildParticipantsAndPasses(memberIds, program, venueId, rate) {
          var tasks = memberIds.map(function (mid) {
            if (program === "oneday") {
              var amountEl = document.querySelector(
                '.pay-amount[data-member="' + mid + '"]',
              );
              var paidEl = document.querySelector(
                '.pay-paid[data-member="' + mid + '"]',
              );
              var amount = +(amountEl ? amountEl.value : 0) || 0;
              var paid = paidEl ? paidEl.value === "1" : false;
              var courtFee = Math.round((amount * rate) / 100);
              return Promise.resolve({
                memberId: mid,
                oneday: {
                  amount: amount,
                  paid: paid,
                  paidDate: paid ? todayStr() : null,
                  courtFeeAmount: courtFee,
                  coachAmount: amount - courtFee,
                  settled: false,
                  settledDate: null,
                },
              });
            } else {
              var existing = passesArr().find(function (p) {
                return (
                  p.memberId === mid &&
                  p.venueId === venueId &&
                  p.status === "active"
                );
              });
              if (existing) {
                return Promise.resolve({ memberId: mid, passId: existing.id });
              }
              var amtEl = document.querySelector(

                  var code = (e && e.message) || "";
                  toast(

          byId("modal-box").addEventListener("click", function (e) {

        /* ============================= 쓰기 동작 ============================= */

        function cycleAttendance(lessonId, memberId) {
          var l = state.cache.lessons[lessonId];
          if (!l) return;
          var parts = (l.participants || []).map(function (p) {
            if (p.memberId !== memberId) return p;
            var next =
              p.attendance === "scheduled"
                ? "done"
                : p.attendance === "done"
                  ? "absent"
                  : "scheduled";
            return Object.assign({}, p, { attendance: next });
          });
          state.db.doc("lessons/" + lessonId).update({ participants: parts });
        }

        var pendingLessonCompletions = Object.create(null);
        function completeLesson(lessonId) {
          if (pendingLessonCompletions[lessonId]) return;
          var db = state.db;
          if (!db) return;
          pendingLessonCompletions[lessonId] = true;
          return window.CourtNoteLessonCompletion.completeLesson(db, lessonId).then(function (result) {
            delete pendingLessonCompletions[lessonId];
            if (state.db !== db) return;
            toast(result.completed ? "수업을 완료 처리했어요" : "이미 완료된 수업이에요");
          }, function (error) {
            delete pendingLessonCompletions[lessonId];
            if (state.db !== db) return;
            var messages = {
              pass_not_available: "수강권 상태나 남은 횟수를 확인해주세요. 저장하지 않았어요.",

              lesson_not_found: "수업을 찾을 수 없어요. 새로고침해주세요."
            };
            toast(messages[error.code] || "완료 처리를 저장하지 못했어요. 연결과 권한을 확인해주세요.");

        function markOnedayPaid(lessonId, memberId) {
          var l = state.cache.lessons[lessonId];
          var parts = (l.participants || []).map(function (p) {
            if (p.memberId !== memberId || !p.oneday) return p;
            var noFee = (p.oneday.courtFeeAmount || 0) <= 0;
            /* 장소 사용료 0%인 곳은 코치가 100% 가져가서 보낼 돈이 없으므로 입금 확인과 동시에 정산도 끝낸다 */
            return Object.assign({}, p, {
              oneday: Object.assign({}, p.oneday, {
                paid: true,
                paidDate: todayStr(),
                settled: noFee ? true : p.oneday.settled,

            .doc("lessons/" + lessonId)
